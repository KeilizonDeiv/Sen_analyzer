<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment & Emotion Analyzer - AI Review Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .input-section {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-export {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }
        
        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            animation: slideIn 0.5s;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .emotion-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .emotion-label {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .confidence {
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        
        .emotion-breakdown {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .emotion-bar {
            display: flex;
            margin-bottom: 12px;
            align-items: center;
        }
        
        .emotion-name {
            width: 100px;
            font-weight: 600;
            font-size: 0.9em;
        }
        
        .emotion-progress {
            flex: 1;
            background: #e0e0e0;
            border-radius: 20px;
            height: 24px;
            margin: 0 10px;
            overflow: hidden;
        }
        
        .emotion-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            color: white;
            font-weight: bold;
        }
        
        .emotion-percent {
            width: 50px;
            text-align: right;
            font-weight: 600;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .chart-wrapper {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .chart-wrapper h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .history {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        
        .history-item:hover {
            transform: translateX(5px);
        }
        
        .history-text {
            font-style: italic;
            margin-bottom: 8px;
            color: #555;
            word-break: break-word;
        }
        
        .history-meta {
            font-size: 0.9em;
            color: #777;
        }
        
        .history-emotion {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: 600;
            margin-right: 8px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                min-width: auto;
            }
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px 15px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Sentiment & Emotion Analyzer</h1>
            <p class="subtitle">Advanced AI-Powered Customer Review Analysis</p>
        </header>
        
        <div class="card">
            <div class="input-section">
                <label for="reviewText">Enter a customer review to analyze:</label>
                <textarea 
                    id="reviewText" 
                    rows="5" 
                    placeholder="Example: This product exceeded my expectations! The quality is amazing and shipping was fast. Highly recommend!"
                ></textarea>
            </div>
            
            <div class="button-group">
                <button class="btn-primary" onclick="analyzeReview()">🔍 Analyze</button>
                <button class="btn-secondary" onclick="clearInput()">Clear</button>
                <button class="btn-export" onclick="exportResults()">📥 Export CSV</button>
                <button class="btn-secondary" onclick="clearCache()">Refresh Cache</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Analyzing...</p>
            </div>
            
            <div class="error" id="error"></div>
            <div class="success-message" id="successMessage"></div>
            
            <div class="result" id="result">
                <div class="emotion-box">
                    <div class="emotion-label" id="emotionLabel"></div>
                    <div class="confidence" id="confidenceText"></div>
                </div>
                <div class="emotion-breakdown" id="emotionBreakdown"></div>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="card">
                <h2 style="margin-bottom: 20px;">📊 Overall Statistics</h2>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-box">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">Total Analyzed</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="avgConfidence">0%</div>
                        <div class="stat-label">Avg Confidence</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2 style="margin-bottom: 20px;">💡 Emotion Distribution</h2>
                <div class="chart-wrapper">
                    <canvas id="emotionChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2 style="margin-bottom: 20px;">📝 Recent Analysis History</h2>
            <div class="history" id="history">
                <p style="text-align: center; color: #999;">No analysis yet. Try analyzing a review above!</p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let emotionChart = null;
        
        function analyzeReview() {
            const text = document.getElementById('reviewText').value;
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');
            
            // Hide previous results
            result.style.display = 'none';
            error.style.display = 'none';
            
            if (!text.trim()) {
                showError('Please enter some text to analyze');
                return;
            }
            
            // Show loading
            loading.style.display = 'block';
            
            // Send request to backend
            fetch('/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                
                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                // Display result
                const emotionLabel = document.getElementById('emotionLabel');
                const confidenceText = document.getElementById('confidenceText');
                const emotionBreakdown = document.getElementById('emotionBreakdown');
                
                emotionLabel.textContent = data.emotion;
                confidenceText.textContent = `Confidence: ${data.confidence.toFixed(2)}%`;
                
                // Show emotion breakdown
                let breakdownHTML = '<h4 style="margin-bottom: 10px;">Emotion Breakdown:</h4>';
                for (const [emotion, percentage] of Object.entries(data.emotion_details)) {
                    const width = percentage;
                    breakdownHTML += `
                        <div class="emotion-bar">
                            <div class="emotion-name">${emotion}</div>
                            <div class="emotion-progress">
                                <div class="emotion-fill" style="width: ${width}%">
                                    ${width > 15 ? percentage.toFixed(1) + '%' : ''}
                                </div>
                            </div>
                            <div class="emotion-percent">${percentage.toFixed(1)}%</div>
                        </div>
                    `;
                }
                emotionBreakdown.innerHTML = breakdownHTML;
                
                result.style.display = 'block';
                
                // Update statistics and history
                updateStats();
                updateHistory();
            })
            .catch(err => {
                loading.style.display = 'none';
                showError('An error occurred while analyzing the text');
                console.error(err);
            });
        }
        
        function clearInput() {
            document.getElementById('reviewText').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }
        
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.style.display = 'block';
        }
        
        function showSuccess(message) {
            const success = document.getElementById('successMessage');
            success.textContent = message;
            success.style.display = 'block';
            setTimeout(() => {
                success.style.display = 'none';
            }, 3000);
        }
        
        function updateStats() {
            fetch('/stats')
            .then(response => response.json())
            .then(data => {
                document.getElementById('totalCount').textContent = data.total;
                document.getElementById('avgConfidence').textContent = data.avg_confidence.toFixed(1) + '%';
                
                // Update emotion chart
                updateEmotionChart(data.emotion_counts);
            });
        }
        
        function updateEmotionChart(emotionCounts) {
            const ctx = document.getElementById('emotionChart').getContext('2d');
            const labels = Object.keys(emotionCounts);
            const values = Object.values(emotionCounts);
            
            if (emotionChart) {
                emotionChart.data.labels = labels;
                emotionChart.data.datasets[0].data = values;
                emotionChart.update();
            } else {
                emotionChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: [
                                '#ff6b6b',
                                '#ffd93d',
                                '#6bcf7f',
                                '#ff6348',
                                '#a29bfe',
                                '#00b894'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }
        }
        
        function updateHistory() {
            fetch('/history')
            .then(response => response.json())
            .then(data => {
                const historyDiv = document.getElementById('history');
                
                if (data.length === 0) {
                    historyDiv.innerHTML = '<p style="text-align: center; color: #999;">No analysis yet. Try analyzing a review above!</p>';
                    return;
                }
                
                // Show last 10 items in reverse order (most recent first)
                const recentItems = data.slice(-10).reverse();
                
                historyDiv.innerHTML = recentItems.map(item => `
                    <div class="history-item">
                        <div class="history-text">"${item.text.substring(0, 100)}${item.text.length > 100 ? '...' : ''}"</div>
                        <div class="history-meta">
                            <span class="history-emotion">${item.emotion}</span>
                            <strong>${item.confidence.toFixed(2)}%</strong> - ${item.timestamp}
                        </div>
                    </div>
                `).join('');
            });
        }
        
        function exportResults() {
            fetch('/export')
            .then(response => {
                if (response.ok) {
                    return response.blob();
                }
                throw new Error('Export failed');
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sentiment_analysis_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                showSuccess('Results exported successfully!');
            })
            .catch(err => {
                showError('Failed to export results');
                console.error(err);
            });
        }
        
        function clearCache() {
            fetch('/clear-cache', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                showSuccess('Cache cleared successfully!');
                updateStats();
                updateHistory();
            })
            .catch(err => {
                showError('Failed to clear cache');
                console.error(err);
            });
        }
        
        // Allow Enter key to submit (with Shift+Enter for new line)
        document.getElementById('reviewText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                analyzeReview();
            }
        });
        
        // Load initial stats and history on page load
        window.addEventListener('load', function() {
            updateStats();
            updateHistory();
        });
    </script>
</body>
</html>
